# =====================================================================
#  Perfil de PRODUCCION
#  Activar al ejecutar:  java -jar app.jar --spring.profiles.active=prod
#  Las credenciales NO van aqui: se leen de variables de entorno.
# =====================================================================

# --- Base de datos (credenciales por variable de entorno) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techstore_db}
spring.datasource.username=${DB_USERNAME:admin_techstore}
spring.datasource.password=${DB_PASSWORD}

# 'update' crea/actualiza las tablas automaticamente (comodo en el primer
# despliegue). Cuando el esquema este estable, cambiar a 'validate'.
spring.jpa.hibernate.ddl-auto=update

# --- Sin ruido de logs en produccion ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.techstore=INFO
logging.level.root=WARN
logging.file.name=logs/techstore.log

# --- Detras del reverse proxy (IIS/Nginx) que termina el HTTPS ---
# Permite que Spring detecte el HTTPS real via cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

# --- Endurecimiento de la cookie de sesion ---
# La cookie solo viaja por HTTPS (requiere acceder por el dominio con certificado)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# El timeout de 15 min (RNF-06) se hereda de application.properties
