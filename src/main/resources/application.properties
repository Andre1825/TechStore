spring.application.name=tech-store-project

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/techstore_db
spring.datasource.username=admin_techstore
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.techstore=DEBUG

# RNF-06: Timeout automatico de sesion tras 15 minutos de inactividad
server.servlet.session.timeout=15m

# Rechazar cantidades e identificadores decimales en lugar de truncarlos.
spring.jackson.deserialization.accept-float-as-int=false
server.servlet.session.cookie.same-site=lax

# La contraseña se exige únicamente al crear el administrador inicial.
techstore.bootstrap.admin-password=${ADMIN_PASSWORD:}
techstore.seed-demo-data=true

# SNS es opcional en desarrollo; usa el rol temporal de EC2 al desplegar.
techstore.aws.region=${AWS_REGION:us-east-1}
techstore.aws.sns.enabled=${SNS_ENABLED:false}
techstore.aws.sns.topic-arn=${SNS_TOPIC_ARN:}
