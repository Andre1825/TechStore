spring.application.name=tech-store-project

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/techstore_db
spring.datasource.username=admin_techstore
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.techstore=DEBUG

# RNF-06: Timeout automatico de sesion tras 15 minutos de inactividad
server.servlet.session.timeout=15m
